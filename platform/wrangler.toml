name = "lerping-platform"
main = "src/index.js"
compatibility_date = "2026-01-15"
workers_dev = false
# Enable after associating the account's zone:
# routes = [{ pattern = "lerping.app", custom_domain = true }]

[assets]
directory = "../docs"
binding = "SITE"
run_worker_first = true
html_handling = "none"

[vars]
ACCESS_ISSUER = "https://YOUR-TEAM.cloudflareaccess.com"
ACCESS_AUDIENCE = "YOUR-CLOUDFLARE-ACCESS-APPLICATION-AUD"

[[d1_databases]]
binding = "DB"
database_name = "lerping-platform"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "lerping-private-media"

[[ratelimits]]
name = "REPORT_LIMIT"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

[[ratelimits]]
name = "PUBLISH_LIMIT"
namespace_id = "1002"
simple = { limit = 12, period = 60 }
