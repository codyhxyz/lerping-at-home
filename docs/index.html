<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lerping@Home — Works for idle screens</title>
<meta name="description" content="An editorial collection of works for idle screens. Look first, play when you’re ready.">
<style>
  :root { color-scheme: light; --paper:#f7f5ef; --ink:#222522; --muted:#575d55; --line:#cfcec2; --white:#fffdfa; --serif:Iowan Old Style, Palatino Linotype, Book Antiqua, Georgia, serif; --sans:system-ui,sans-serif }
  * { box-sizing:border-box }
  body { margin:0; color:var(--ink); background:var(--paper); font:15px/1.55 var(--sans) }
  a { color:inherit; text-underline-offset:.23em }
  button, select, textarea { font:inherit; color:inherit }
  button, select, .button { padding:.48rem .8rem; border:1px solid var(--line); background:var(--white); border-radius:2px }
  button, select { cursor:pointer }
  button:hover, .button:hover { border-color:var(--ink) }
  button:disabled { cursor:default; opacity:.65 }
  :focus-visible { outline:2px solid #365444; outline-offset:4px }
  .button { display:inline-block; text-decoration:none }
  .primary { color:var(--white); background:var(--ink); border-color:var(--ink) }
  .quiet { padding:0; background:none; border:0; text-decoration:underline; text-underline-offset:.23em }
  .wrap { max-width:1260px; margin:auto; padding-inline:clamp(1.2rem,5vw,4.4rem) }
  .masthead, footer { border-block-end:1px solid var(--line) }
  .masthead .wrap, footer .wrap { display:flex; align-items:center; justify-content:space-between; gap:.7rem 2rem; flex-wrap:wrap; padding-block:1rem }
  .wordmark { font-weight:750; text-decoration:none; letter-spacing:-.025em }
  .label { text-transform:uppercase; letter-spacing:.14em; font-size:.72rem; font-weight:650; color:var(--muted) }
  .muted { color:var(--muted) }
  main { min-height:60vh; padding-block:clamp(2rem,5vw,5rem) }
  h1, h2 { font-family:var(--serif); font-weight:400; line-height:1.04; margin:0; letter-spacing:-.035em; overflow-wrap:anywhere }
  h1 { font-size:clamp(2.8rem,7.5vw,7.2rem) }
  h2 { font-size:clamp(1.8rem,3.5vw,3rem) }
  p { margin:.55rem 0 1rem }
  .feature { display:grid; grid-template-columns:4fr 5fr; gap:clamp(1.6rem,5vw,5rem); align-items:center }
  .feature .intro { max-width:28ch; font-size:1.1rem; margin:1.2rem 0 0 }
  .image, .stage { display:block; width:100%; aspect-ratio:8 / 5; object-fit:cover; background:#dfded4 }
  .feature figure, .card figure { margin:0 }
  figcaption { padding-block:.5rem; font-size:.83rem; color:var(--muted) }
  .filters { display:flex; flex-wrap:wrap; gap:.7rem 1rem; margin:clamp(2.5rem,6vw,5rem) 0 1rem; align-items:end }
  .filters label { display:grid; gap:.22rem }
  .filters select { min-width:7.4rem }
  .shelf { padding-block:2.25rem 2.85rem; border-top:1px solid var(--line) }
  .shelf-header { display:flex; align-items:baseline; gap:.5rem 1.5rem; flex-wrap:wrap; margin-bottom:1.15rem }
  .shelf-header p { margin:0 }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr)); gap:1.3rem; max-width:900px }
  .card { text-decoration:none; min-width:0 }
  .card:hover strong, .feature a:hover strong { text-decoration:underline; text-underline-offset:.25em }
  .card strong { color:var(--ink) }
  .card figcaption { display:flex; justify-content:space-between; gap:.5rem }
  .breadcrumb { margin-bottom:1.5rem; font-size:.87rem }
  .postcard { display:grid; grid-template-columns:minmax(0,8fr) minmax(0,4fr); gap:clamp(1.5rem,4vw,4rem); align-items:start }
  .postcard h1 { font-size:clamp(2.3rem,5vw,4.55rem) }
  .stage { position:relative; overflow:hidden }
  .stage .image, .stage .surface { position:absolute; inset:0; width:100%; height:100%; object-fit:contain }
  .stage .surface { background:#1f211f }
  .status { min-height:1.55em; color:var(--muted); font-size:.87rem }
  .placard { border-block:1px solid var(--line); padding:1.15rem 0; min-width:0 }
  .placard hr { border:0; border-top:1px solid var(--line); margin-block:1rem }
  .tags { display:flex; flex-wrap:wrap; column-gap:.55rem; padding:0; list-style:none; margin:.75rem 0 1.1rem }
  .tags li { border:1px solid var(--line); padding:.12rem .45rem; font-size:.78rem; text-transform:capitalize }
  .actions { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin:.9rem 0 }
  .secondary { display:flex; flex-wrap:wrap; gap:.25rem 1rem; margin-top:1rem; color:var(--muted); font-size:.82rem }
  .parameters { padding-top:.9rem; margin-top:1rem; border-top:1px solid var(--line) }
  .parameters summary { cursor:pointer }
  .parameter { display:grid; gap:.3rem; margin:.75rem 0 }
  .parameter label { display:flex; justify-content:space-between; gap:.5rem }
  .parameter input { accent-color:#365444 }
  .parameter input[type=range] { width:100% }
  dialog, [popover] { max-width:min(28rem,calc(100% - 2rem)); border:1px solid var(--line); background:var(--white); color:var(--ink); padding:1.5rem }
  dialog::backdrop { background:#1c201b66 }
  #artist-panel[open] { position:fixed; inset:0 0 0 auto; margin:0; height:100%; max-height:100%; width:min(100%,28rem); padding:clamp(1.3rem,4vw,3rem) }
  .sheet-close { display:block; margin:0 0 1.4rem auto }
  textarea { display:block; width:100%; resize:vertical; margin:.45rem 0 .75rem }
  footer { border-block:1px solid var(--line) 0; color:var(--muted); font-size:.82rem }
  [hidden] { display:none !important }
  @media (max-width:720px) { .feature, .postcard { grid-template-columns:1fr } }
</style>
</head>
<body>
<header class="masthead"><div class="wrap"><a class="wordmark" href="./" id="home">Lerping@Home</a><span class="label">The Postcard Collection</span></div></header>
<main class="wrap" id="main" tabindex="-1"><!-- main:start --><p role="status">Opening the collection…</p><noscript>Turn on JavaScript to browse and play postcards.</noscript><!-- main:end --></main>
<footer><div class="wrap"><span>Works for idle screens.</span><a href="https://github.com/codyhxyz/lerping-at-home/releases">Lerping for Mac</a><a href="https://github.com/codyhxyz/lerping-at-home">Source &amp; credits</a></div></footer>
<dialog id="artist-panel" aria-labelledby="artist-title"></dialog>
<dialog id="report-panel" aria-labelledby="report-title"></dialog>
<div id="install" popover aria-labelledby="install-title"><h2 id="install-title">Lerping for Mac</h2><p>If the app didn't open, download the latest Mac release and install it, then try again.</p><a href="https://github.com/codyhxyz/lerping-at-home/releases/latest">View Mac downloads ↗</a> <button class="quiet" type="button" popovertarget="install" popovertargetaction="hide">Close</button></div>
<script type="module" src="lerp-web/app.js"></script>
</body>
</html>
